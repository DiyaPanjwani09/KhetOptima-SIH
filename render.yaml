services:
  - type: web
    name: khetoptima-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://khetoptima-frontend.onrender.com
  - type: web
    name: khetoptima-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    publishDir: build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_URL
        value: https://khetoptima-backend.onrender.com
